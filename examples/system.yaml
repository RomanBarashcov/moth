system: acme

tracker:
  type: linear              # linear | jira
  mcp: linear               # MCP server name used to read/comment on tickets
  boards:                   # boards / teams / projects to watch
    - ACME                  # confirmed
  label: moth               # tickets with this label are queued for Moth
  needs_info_label: needs-info

repos:                      # any language; moth-init detects these from the repo
  service-a:
    path: .                 # the project Moth runs in; paths are relative to it
    language: <language>    # e.g. the stack detected from go.mod, package.json, pyproject.toml...
    run: <start command>    # e.g. make run
    test: <full test command>
    test_one: <one test command, {name} = test name>
  service-b:
    path: ../service-b      # other repos of the same system, if any
    language: <language>
    run: <start command>
    test: <full test command>
  web-app:
    path: ../web-app
    language: <language>
    run: <start command>
    test: <full test command>
    playwright_dir: e2e     # folder with Playwright specs (UI repos only)
    e2e: <end-to-end test command>

links:
  - web-app -> service-a: REST /api/v1
  - service-a -> service-b: events via queue `orders`

environments:
  local:
    up: docker compose -f docker/compose.yaml up -d
    down: docker compose -f docker/compose.yaml down -v
    seed: make db-seed
  staging:
    read_only:
      logs: { mcp: axiom }
      metrics: { mcp: grafana }
      errors: { mcp: sentry }
  prod:
    read_only:
      logs: { mcp: axiom }
      errors: { mcp: sentry }
      data: { mcp: prod-postgres }   # use a read-only DB role

evidence:
  branch: moth-evidence     # orphan branch in each service repo; holds PR screenshots/videos, never merged
  gif: true                 # convert Playwright videos to GIF for inline PR rendering (needs ffmpeg)

guardrails:
  max_turns: 150
  timeout_minutes: 45
  reproduce_attempts: 3
  max_files: 10
  max_open_prs: 3
  concurrency: 1
  bash_deny:                # extra commands the guard hook blocks
    - pattern: "psql\\s+.*prod"
      reason: prod DB only via the read-only MCP
    - pattern: "kubectl\\s+.*--context[= ]prod"
      reason: no kubectl against prod
  write_verbs: default      # or a list overriding guard.py DEFAULT_WRITE_VERBS
